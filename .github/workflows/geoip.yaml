name: Publish GeoLite.mmdb

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 1 */7 * *'

env:
  MAXMIND_USER_ID: "715750"
  DB_TYPES: "GeoLite2-ASN GeoLite2-Country"
  UPLOAD_DIR: "upload"
  RETRY_COUNT: 3

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      
    steps:
    - name: 验证必需工具
      run: |
        for tool in wget tar git curl gh; do
          if ! command -v $tool &> /dev/null; then
            echo "❌ 未安装 $tool"
            exit 1
          fi
        done
        echo "✅ 所有必需工具已安装"

    - name: 克隆仓库
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1

    - name: 下载并解压数据库
      id: download
      run: |
        mkdir -p ${{ env.UPLOAD_DIR }}
        
        download_with_retry() {
          local db_name=$1
          local retry=0
          
          while [ $retry -lt ${{ env.RETRY_COUNT }} ]; do
            echo "🔄 尝试下载 $db_name (第 $((retry+1)) 次尝试)"
            
            if wget --content-disposition \
                   --user="${{ env.MAXMIND_USER_ID }}" \
                   --password="${{ secrets.LICENSE_KEY }}" \
                   "https://download.maxmind.com/geoip/databases/$db_name/download?suffix=tar.gz" \
                   -O "${db_name}.tar.gz" \
                   --tries=3 \
                   --timeout=30; then
              return 0
            fi
            
            retry=$((retry+1))
            if [ $retry -lt ${{ env.RETRY_COUNT }} ]; then
              echo "⚠️ 下载失败，5秒后重试..."
              sleep 5
            fi
          done
          
          echo "❌ 下载 $db_name 失败"
          return 1
        }
        
        for db in ${{ env.DB_TYPES }}; do
          echo "📦 处理 $db"
          
          if ! download_with_retry "$db"; then
            exit 1
          fi
          
          if [ ! -f "${db}.tar.gz" ] || [ ! -s "${db}.tar.gz" ]; then
            echo "❌ ${db}.tar.gz 文件无效"
            exit 1
          fi
          
          if ! tar -xzf "${db}.tar.gz"; then
            echo "❌ 解压 ${db} 失败"
            exit 1
          fi
          
          unpack_dir=$(find . -maxdepth 1 -type d -name "${db}_*" | head -n1)
          if [ -z "$unpack_dir" ]; then
            echo "❌ 未找到 ${db} 解压目录"
            exit 1
          fi
          
          if ! cp -v "${unpack_dir}"/*.mmdb ${{ env.UPLOAD_DIR }}/; then
            echo "❌ 复制 ${db} mmdb文件失败"
            exit 1
          fi
          
          rm -rf "${unpack_dir}" "${db}.tar.gz"
          echo "✅ $db 处理完成"
        done
        
        mmdb_files=$(ls -1 ${{ env.UPLOAD_DIR }}/*.mmdb 2>/dev/null)
        if [ -z "$mmdb_files" ]; then
          echo "❌ 未找到任何mmdb文件"
          exit 1
        fi
        
        mmdb_count=$(echo "$mmdb_files" | wc -l)
        mmdb_names=$(echo "$mmdb_files" | xargs -n1 basename | tr '\n' ' ')
        tag_name=$(date +"%Y.%m.%d")
        
        echo "MMDB_COUNT=$mmdb_count" >> $GITHUB_ENV
        echo "MMDB_NAMES=$mmdb_names" >> $GITHUB_ENV
        echo "TAG_NAME=$tag_name" >> $GITHUB_ENV
        
        echo "📋 生成的文件："
        for file in ${{ env.UPLOAD_DIR }}/*.mmdb; do
          echo "  $(basename $file): $(sha256sum $file | cut -d' ' -f1)"
        done

    - name: 清理旧的 latest Release
      if: success()
      run: |
        echo "🧹 清理旧的 latest Release..."
        
        # 获取所有 latest releases（包括草稿）
        gh release list --limit 100 | grep "latest" | while read -r line; do
          release_name=$(echo "$line" | awk '{print $1}')
          if [ "$release_name" = "latest" ]; then
            echo "  删除旧的 Release: $release_name"
            gh release delete "$release_name" --yes || echo "  删除失败，继续..."
          fi
        done
        
        # 清理空的 latest 标签（如果有）
        git tag -d latest 2>/dev/null || echo "本地无 latest 标签"
        git push origin :refs/tags/latest 2>/dev/null || echo "远程无 latest 标签"
        
        echo "✅ 清理完成"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 上传到服务器
      if: success()
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "${{ env.UPLOAD_DIR }}/*.mmdb"
        target: "/opt/1panel/apps/openresty/openresty/www/sites/sh.yxliuchn.uk/index/OwnUseShell"
        overwrite: true
        strip_components: 0

    - name: 生成并提交 README.md
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        
        cat > README.md << EOF
        # GeoLite.mmdb 数据库仓库
        
        本仓库自动同步 [MaxMind](https://www.maxmind.com) 官方的 GeoLite2 数据库。
        
        ## 📊 数据库信息
        
        | 项目 | 详情 |
        |------|------|
        | **更新时间** | ${{ env.TAG_NAME }} |
        | **文件数量** | ${{ env.MMDB_COUNT }} 个 |
        | **包含文件** | ${{ env.MMDB_NAMES }} |
        | **更新周期** | 每7天自动更新 |
        
        ## 📥 下载方式
        
        ### Release 下载
        - [📦 最新版本 (latest)](https://github.com/${{ github.repository }}/releases/tag/latest)
        - [📂 所有版本](https://github.com/${{ github.repository }}/releases)
        
        ### 直接链接
        $(for file in ${{ env.MMDB_NAMES }}; do
          echo "- [\`$file\`](https://github.com/${{ github.repository }}/releases/download/latest/$file)"
        done)
        
        ## 🔄 自动更新机制
        
        工作流每7天自动执行一次，流程如下：
        1. 从 MaxMind 官方下载最新数据库
        2. 验证文件完整性和有效性
        3. 创建带日期标签的新 Release
        4. 更新 \`latest\` 标签指向最新版本
        5. 保留最近5个版本，自动清理旧版本
        
        ## ⚙️ 使用示例
        
        ### Nginx
        \`\`\`nginx
        geoip2 /path/to/GeoLite2-Country.mmdb {
            \$geoip2_country_code country iso_code;
        }
        \`\`\`
        
        ### Python
        \`\`\`python
        import geoip2.database
        
        reader = geoip2.database.Reader('GeoLite2-Country.mmdb')
        response = reader.country('8.8.8.8')
        print(response.country.iso_code)
        \`\`\`
        
        ## 📄 许可证
        
        本仓库的数据库文件遵循 MaxMind 官方的 [GeoLite2 最终用户许可协议](https://www.maxmind.com/en/geolite2/eula)。
        EOF
        
        if ! git diff --quiet README.md; then
          git add README.md
          git commit -m "docs: 更新数据库信息 - ${{ env.TAG_NAME }}"
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
        fi

    - name: 创建日期版本 Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        body: |
          ## 🗓️ 数据库更新 - ${{ env.TAG_NAME }}
          
          ### 📊 包含文件
          - 共计 **${{ env.MMDB_COUNT }}** 个数据库文件
          - 文件列表：${{ env.MMDB_NAMES }}
          
          ### 📅 更新说明
          - 自动同步于 ${{ env.TAG_NAME }}
          - 数据来源：MaxMind GeoLite2
        files: upload/*.mmdb
        make_latest: false
        prerelease: false
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 创建最新的 latest Release
      if: success()
      run: |
        echo "📦 创建 latest Release..."
        
        # 确保 latest 标签指向最新版本
        git tag -f latest ${{ env.TAG_NAME }}
        git push origin latest --force
        
        # 使用 GitHub CLI 创建 Release
        gh release create latest \
          upload/*.mmdb \
          --title "🚀 最新版本数据库 - ${{ env.TAG_NAME }}" \
          --notes "## 📦 当前版本：${{ env.TAG_NAME }}

          **包含文件：**
          - 共 **${{ env.MMDB_COUNT }}** 个数据库文件
          - ${{ env.MMDB_NAMES }}
          
          ### 💡 使用说明
          点击下方"Assets"下载对应的 \`.mmdb\` 文件。
          
          ### 📅 更新时间
          ${{ env.TAG_NAME }}
          
          ### 🔗 历史版本
          查看 [Releases](https://github.com/${{ github.repository }}/releases) 页面获取所有历史版本。" \
                    --latest \
                    --draft=false \
                    --prerelease=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 清理旧版本（保留最新5个）
      if: success()
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: 5
        delete_tags: true
        delete_older_only: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 验证结果
      run: |
        echo "📊 执行结果摘要："
        echo "  - 日期版本标签: ${{ env.TAG_NAME }}"
        echo "  - 最新版本标签: latest"
        echo "  - 文件数: ${{ env.MMDB_COUNT }}"
        echo "  - 文件列表: ${{ env.MMDB_NAMES }}"
        echo ""
        echo "✅ 工作流执行成功！"
        echo "🌐 查看结果: https://github.com/${{ github.repository }}/releases"
