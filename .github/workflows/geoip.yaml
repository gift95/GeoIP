name: Publish GeoLite.mmdb

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 0 1 */7 * *  # 每7天的凌晨1点（UTC）执行

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 延长超时时间
    permissions:
      contents: write  # 需写权限操作标签、Release和推送代码
    steps:
    - name: 检查依赖工具
      run: |
        REQUIRED_TOOLS=("wget" "tar" "git")
        for TOOL in "${REQUIRED_TOOLS[@]}"; do
            if ! command -v $TOOL &> /dev/null; then
                echo "错误: 未安装 $TOOL"
                exit 1
            fi
        done

    - name: 克隆仓库主分支（用于更新README.md）
      uses: actions/checkout@v4
      with:
        ref: main  # 替换为你的仓库主分支（如master）
        fetch-depth: 1

    - name: 下载并解压 GeoLite.mmdb
      run: |
        # 核心修改：添加 GeoLite2-City 到数据库列表
        DATABASES=(
          "GeoLite2-ASN"
          "GeoLite2-Country"
          "GeoLite2-City"
        )
        mkdir -p upload

        for DB in "${DATABASES[@]}"; do
            echo "===== 处理 $DB 数据库 ====="
            # 下载 tar.gz 文件
            echo "正在下载 $DB 数据库..."
            wget --content-disposition --user="715750" --password="${{ secrets.LICENSE_KEY }}" \
              "https://download.maxmind.com/geoip/databases/$DB/download?suffix=tar.gz" \
              -O "${DB}.tar.gz"  # 显式指定输出文件名，避免自动重命名问题

            # 检查下载是否成功
            if [ ! -f "${DB}.tar.gz" ]; then
                echo "错误: $DB 数据库下载失败"
                exit 1
            fi

            # 解压文件
            echo "正在解压 ${DB}.tar.gz..."
            tar -zxvf "${DB}.tar.gz"
            UNPACK_DIR=$(ls -d ${DB}_* | head -n1)  # 获取解压后的目录名

            # 检查解压目录是否存在
            if [ -z "$UNPACK_DIR" ]; then
                echo "错误: $DB 数据库解压失败"
                exit 1
            fi

            # 精准拷贝 mmdb 文件
            cp -v "$UNPACK_DIR"/GeoLite2-*.mmdb upload/
            echo "===== $DB 数据库处理完成 =====\n"
        done

        # 检查是否成功获取 mmdb 文件
        MMDB_COUNT=$(ls -1 upload/*.mmdb 2>/dev/null | wc -l)
        if [ $MMDB_COUNT -eq 0 ]; then
            echo "错误: 未找到任何 mmdb 文件"
            exit 1
        fi
        # 获取mmdb文件列表（用于README.md）
        MMDB_FILES=$(ls -1 upload/*.mmdb | xargs -n1 basename | tr '\n' ', ')
        echo "成功获取 $MMDB_COUNT 个 mmdb 文件：$MMDB_FILES"
        # 将信息存入环境变量
        echo "MMDB_COUNT=$MMDB_COUNT" >> $GITHUB_ENV
        echo "MMDB_FILES=$MMDB_FILES" >> $GITHUB_ENV
        echo "TAG_NAME=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: 自动更新 README.md
      run: |
        # 生成README.md内容（可按需自定义固定内容和动态内容）
        cat > README.md << EOF
# GeoLite.mmdb 数据库仓库
本仓库自动同步 MaxMind 官方的 GeoLite2 数据库，包含 ASN、国家、城市地理信息。

## 📅 最新更新时间
${{ env.TAG_NAME }}

## 📁 包含的数据库文件
共 ${MMDB_COUNT} 个文件：${MMDB_FILES}

## 🚀 下载方式
1. **Release 页面**：[最新版本](https://github.com/${{ github.repository }}/releases/tag/latest)
2. **直接下载**：
   - [GeoLite2-ASN.mmdb](https://github.com/${{ github.repository }}/releases/download/latest/GeoLite2-ASN.mmdb)
   - [GeoLite2-Country.mmdb](https://github.com/${{ github.repository }}/releases/download/latest/GeoLite2-Country.mmdb)
   - [GeoLite2-City.mmdb](https://github.com/${{ github.repository }}/releases/download/latest/GeoLite2-City.mmdb)

## ⚙️ 自动更新
仓库每 7 天自动从 MaxMind 官网同步最新数据库，并更新 Release 和 \`latest\` 标签。

## 📄 许可证
本仓库的数据库文件遵循 MaxMind 官方的 [GeoLite2 许可证](https://www.maxmind.com/en/geoip2-geolite2-license)。
EOF
        # 检查README.md是否修改成功
        echo "查看更新后的README.md内容："
        cat README.md

    - name: 推送更新后的 README.md 到主分支
      run: |
        # 配置Git用户信息
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        # 检查修改
        git add README.md
        git diff --quiet HEAD README.md || git commit -m "docs: 更新README.md - ${{ env.TAG_NAME }}"
        # 推送修改（非强制推送，避免覆盖主分支）
        git push origin main  # 替换为你的仓库主分支（如master）

    - name: 上传到 Releases 并标记为 Latest
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        body: "GeoLite.mmdb 数据库更新 - ${{ env.TAG_NAME }}\n共包含 ${{ env.MMDB_COUNT }} 个文件：${{ env.MMDB_FILES }}"
        files: upload/*.mmdb
        make_latest: true  # 核心：将该Release标记为仓库的Latest Release

    - name: 清理旧 Releases
      uses: dev-drprasad/delete-older-releases@v0.2.0
      with:
        keep_latest: 5  # 保留最新5个版本，可按需调整
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 操作 latest 标签（覆盖为最新版本）
      run: |
        # 配置Git用户信息（操作标签需要）
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        
        # 克隆仓库（仅克隆标签，加快速度）
        git clone --depth=1 --tags "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" repo
        cd repo
        
        # 拉取最新的标签（确保刚创建的 TAG_NAME 标签被拉取到本地）
        git pull --tags
        
        # 删除本地和远程的 latest 标签（若存在）
        git tag -d latest 2>/dev/null || echo "本地无 latest 标签，跳过删除"
        git push origin :refs/tags/latest 2>/dev/null || echo "远程无 latest 标签，跳过删除"
        
        # 基于当前最新发布的标签创建 latest 标签
        git tag -a latest ${{ env.TAG_NAME }} -m "Latest GeoLite.mmdb release: ${{ env.TAG_NAME }}"
        
        # 推送 latest 标签到远程
        git push origin latest
        
        echo "成功将 latest 标签关联到 ${{ env.TAG_NAME }}"
