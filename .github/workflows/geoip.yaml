name: Publish GeoLite.mmdb

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 1 */7 * *'

env:
  MAXMIND_USER_ID: "715750"
  DB_TYPES: "GeoLite2-ASN GeoLite2-Country"
  UPLOAD_DIR: "upload"
  RETRY_COUNT: 3
  KEEP_RELEASES: 5

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      
    steps:
    - name: 验证必需工具
      run: |
        for tool in wget tar git curl gh; do
          if ! command -v $tool &> /dev/null; then
            echo "❌ 未安装 $tool"
            exit 1
          fi
        done
        echo "✅ 所有必需工具已安装"
        echo "🔍 GH_TOKEN 是否设置: ${{ secrets.GITHUB_TOKEN != '' && '是' || '否' }}"

    - name: 克隆仓库
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1

    - name: 下载并解压数据库
      id: download
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p ${{ env.UPLOAD_DIR }}
        
        # 验证 License Key
        if [ -z "${{ secrets.LICENSE_KEY }}" ]; then
          echo "❌ 未设置 LICENSE_KEY 密钥"
          exit 1
        fi
        
        download_with_retry() {
          local db_name=$1
          local retry=0
          
          while [ $retry -lt ${{ env.RETRY_COUNT }} ]; do
            echo "🔄 尝试下载 $db_name (第 $((retry+1)) 次尝试)"
            
            if wget --content-disposition \
                   --user="${{ env.MAXMIND_USER_ID }}" \
                   --password="${{ secrets.LICENSE_KEY }}" \
                   "https://download.maxmind.com/geoip/databases/$db_name/download?suffix=tar.gz" \
                   -O "${db_name}.tar.gz" \
                   --tries=3 \
                   --timeout=30 \
                   --progress=bar:force 2>&1; then
              return 0
            fi
            
            retry=$((retry+1))
            if [ $retry -lt ${{ env.RETRY_COUNT }} ]; then
              echo "⚠️ 下载失败，5秒后重试..."
              sleep 5
            fi
          done
          
          echo "❌ 下载 $db_name 失败"
          return 1
        }
        
        # 处理每个数据库
        for db in ${{ env.DB_TYPES }}; do
          echo "📦 处理 $db"
          
          if ! download_with_retry "$db"; then
            exit 1
          fi
          
          # 验证文件完整性
          if [ ! -f "${db}.tar.gz" ] || [ ! -s "${db}.tar.gz" ]; then
            echo "❌ ${db}.tar.gz 文件无效"
            exit 1
          fi
          
          # 解压文件
          if ! tar -xzf "${db}.tar.gz"; then
            echo "❌ 解压 ${db} 失败"
            exit 1
          fi
          
          # 查找解压目录
          unpack_dir=$(find . -maxdepth 1 -type d -name "${db}_*" | head -n1)
          if [ -z "$unpack_dir" ]; then
            echo "❌ 未找到 ${db} 解压目录"
            exit 1
          fi
          
          # 复制mmdb文件
          if ! cp -v "${unpack_dir}"/*.mmdb ${{ env.UPLOAD_DIR }}/; then
            echo "❌ 复制 ${db} mmdb文件失败"
            exit 1
          fi
          
          # 清理临时文件
          rm -rf "${unpack_dir}" "${db}.tar.gz"
          echo "✅ $db 处理完成"
        done
        
        # 验证mmdb文件
        mmdb_files=$(ls -1 ${{ env.UPLOAD_DIR }}/*.mmdb 2>/dev/null)
        if [ -z "$mmdb_files" ]; then
          echo "❌ 未找到任何mmdb文件"
          exit 1
        fi
        
        # 统计文件信息
        mmdb_count=$(echo "$mmdb_files" | wc -l)
        mmdb_names=$(echo "$mmdb_files" | xargs -n1 basename | tr '\n' ' ')
        tag_name=$(date +"%Y.%m.%d")
        
        # 设置环境变量
        echo "MMDB_COUNT=$mmdb_count" >> $GITHUB_ENV
        echo "MMDB_NAMES=$mmdb_names" >> $GITHUB_ENV
        echo "TAG_NAME=$tag_name" >> $GITHUB_ENV
        
        # 输出文件校验信息
        echo "📋 生成的文件校验信息："
        for file in ${{ env.UPLOAD_DIR }}/*.mmdb; do
          echo "  $(basename $file): $(sha256sum $file | cut -d' ' -f1)"
        done

    - name: 清理旧的 latest Release
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🧹 清理旧的 latest Release..."
        
        # 使用更精确的匹配
        if gh release view latest --repo "${{ github.repository }}" 2>/dev/null; then
          echo "  删除旧的 Release: latest"
          gh release delete latest --yes --repo "${{ github.repository }}" || echo "  删除失败，继续..."
        else
          echo "  latest Release 不存在，跳过删除"
        fi
        
        # 清理空的 latest 标签
        git tag -d latest 2>/dev/null || echo "本地无 latest 标签"
        git push origin :refs/tags/latest 2>/dev/null || echo "远程无 latest 标签"
        
        echo "✅ 清理完成"

    - name: 生成并提交 README.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        
        cat > README.md << 'EOF'
        # 🌍 GeoLite.mmdb 数据库仓库
        
        本仓库自动同步 [MaxMind](https://www.maxmind.com) 官方的 GeoLite2 数据库。
        
        ## 📊 数据库信息
        
        | 项目 | 详情 |
        |------|------|
        | **更新时间** | ${{ env.TAG_NAME }} |
        | **文件数量** | ${{ env.MMDB_COUNT }} 个 |
        | **包含文件** | ${{ env.MMDB_NAMES }} |
        | **更新周期** | 每7天自动更新 |
        
        ## 📥 下载方式
        
        ### Release 下载
        - [📦 最新版本 (latest)](https://github.com/${{ github.repository }}/releases/tag/latest)
        - [📂 所有版本](https://github.com/${{ github.repository }}/releases)
        
        ### 直接链接
        $(for file in ${{ env.MMDB_NAMES }}; do
          echo "- [\`$file\`](https://github.com/${{ github.repository }}/releases/download/latest/$file)"
        done)
        
        ## 🔄 自动更新机制
        
        工作流每7天自动执行一次，流程如下：
        1. 从 MaxMind 官方下载最新数据库
        2. 验证文件完整性和有效性
        3. 创建带日期标签的新 Release
        4. 更新 \`latest\` 标签指向最新版本
        5. 保留最近 ${{ env.KEEP_RELEASES }} 个版本，自动清理旧版本
        
        ## ⚙️ 使用示例
        
        ### Nginx
        ```nginx
        geoip2 /path/to/GeoLite2-Country.mmdb {
            \$geoip2_country_code country iso_code;
        }
