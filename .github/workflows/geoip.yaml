name: Publish GeoLite.mmdb

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 1 */7 * *'

env:
  MAXMIND_USER_ID: "715750"
  DB_TYPES: "GeoLite2-ASN GeoLite2-Country GeoLite-City"
  UPLOAD_DIR: "upload"
  RETRY_COUNT: 3
  KEEP_RELEASES: 5

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      
    steps:
    - name: 验证必需工具
      run: |
        for tool in wget tar git curl gh; do
          if ! command -v $tool &> /dev/null; then
            echo "❌ 未安装 $tool"
            exit 1
          fi
        done
        echo "✅ 所有必需工具已安装"

    - name: 克隆仓库
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 1

    - name: 下载并解压数据库
      id: download
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p ${{ env.UPLOAD_DIR }}
        
        if [ -z "${{ secrets.LICENSE_KEY }}" ]; then
          echo "❌ 未设置 LICENSE_KEY 密钥"
          exit 1
        fi
        
        download_with_retry() {
          local db_name=$1
          local retry=0
          
          while [ $retry -lt ${{ env.RETRY_COUNT }} ]; do
            echo "🔄 尝试下载 $db_name (第 $((retry+1)) 次尝试)"
            
            if wget --content-disposition \
                   --user="${{ env.MAXMIND_USER_ID }}" \
                   --password="${{ secrets.LICENSE_KEY }}" \
                   "https://download.maxmind.com/geoip/databases/$db_name/download?suffix=tar.gz" \
                   -O "${db_name}.tar.gz" \
                   --tries=3 \
                   --timeout=30 \
                   --progress=bar:force 2>&1; then
              return 0
            fi
            
            retry=$((retry+1))
            if [ $retry -lt ${{ env.RETRY_COUNT }} ]; then
              echo "⚠️ 下载失败，5秒后重试..."
              sleep 5
            fi
          done
          
          echo "❌ 下载 $db_name 失败"
          return 1
        }
        
        for db in ${{ env.DB_TYPES }}; do
          echo "📦 处理 $db"
          
          if ! download_with_retry "$db"; then
            exit 1
          fi
          
          if [ ! -f "${db}.tar.gz" ] || [ ! -s "${db}.tar.gz" ]; then
            echo "❌ ${db}.tar.gz 文件无效"
            exit 1
          fi
          
          if ! tar -xzf "${db}.tar.gz"; then
            echo "❌ 解压 ${db} 失败"
            exit 1
          fi
          
          unpack_dir=$(find . -maxdepth 1 -type d -name "${db}_*" | head -n1)
          if [ -z "$unpack_dir" ]; then
            echo "❌ 未找到 ${db} 解压目录"
            exit 1
          fi
          
          if ! cp -v "${unpack_dir}"/*.mmdb ${{ env.UPLOAD_DIR }}/; then
            echo "❌ 复制 ${db} mmdb文件失败"
            exit 1
          fi
          
          rm -rf "${unpack_dir}" "${db}.tar.gz"
          echo "✅ $db 处理完成"
        done
        
        mmdb_files=$(ls -1 ${{ env.UPLOAD_DIR }}/*.mmdb 2>/dev/null)
        if [ -z "$mmdb_files" ]; then
          echo "❌ 未找到任何mmdb文件"
          exit 1
        fi
        
        mmdb_count=$(echo "$mmdb_files" | wc -l)
        mmdb_names=$(echo "$mmdb_files" | xargs -n1 basename | tr '\n' ' ')
        tag_name=$(date +"%Y.%m.%d")
        
        echo "MMDB_COUNT=$mmdb_count" >> $GITHUB_ENV
        echo "MMDB_NAMES=$mmdb_names" >> $GITHUB_ENV
        echo "TAG_NAME=$tag_name" >> $GITHUB_ENV
        
        echo "📋 生成的文件校验信息："
        for file in ${{ env.UPLOAD_DIR }}/*.mmdb; do
          echo "  $(basename $file): $(sha256sum $file | cut -d' ' -f1)"
        done

    - name: 清理旧的 latest Release
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🧹 清理旧的 latest Release..."
        
        if gh release view latest --repo "${{ github.repository }}" 2>/dev/null; then
          echo "  删除旧的 Release: latest"
          gh release delete latest --yes --repo "${{ github.repository }}" || echo "  删除失败，继续..."
        else
          echo "  latest Release 不存在，跳过删除"
        fi
        
        git tag -d latest 2>/dev/null || echo "本地无 latest 标签"
        git push origin :refs/tags/latest 2>/dev/null || echo "远程无 latest 标签"
        
        echo "✅ 清理完成"

    - name: 生成并提交 README.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        
        # 检查模板文件是否存在
        if [ ! -f "README.template.md" ]; then
          echo "❌ README.template.md 模板文件不存在，创建默认模板..."
          cat > README.template.md << 'EOF'
        # 🌍 GeoLite.mmdb 数据库仓库
        
        本仓库自动同步 MaxMind 官方的 GeoLite2 数据库。
        
        ## 📊 数据库信息
        
        | 项目 | 详情 |
        |------|------|
        | **更新时间** | {{TAG_NAME}} |
        | **文件数量** | {{MMDB_COUNT}} 个 |
        | **包含文件** | {{MMDB_NAMES}} |
        | **更新周期** | 每7天自动更新 |
        
        ## 📥 下载方式
        
        ### Release 下载
        - [📦 最新版本 (latest)](https://github.com/{{REPO}}/releases/tag/latest)
        - [📂 所有版本](https://github.com/{{REPO}}/releases)
        
        ### 直接链接
        {{FILE_LINKS}}
        
        ## 🔄 自动更新机制
        
        工作流每7天自动执行一次，流程如下：
        1. 从 MaxMind 官方下载最新数据库
        2. 验证文件完整性和有效性
        3. 创建带日期标签的新 Release
        4. 更新 `latest` 标签指向最新版本
        5. 保留最近 {{KEEP_RELEASES}} 个版本，自动清理旧版本
        
        ## 📄 许可证
        
        本仓库的数据库文件遵循 MaxMind 官方的 [GeoLite2 最终用户许可协议](https://www.maxmind.com/en/geolite2/eula)。
        EOF
        fi
        
        # 复制模板
        cp README.template.md README.md
        
        # 替换变量
        sed -i "s|{{TAG_NAME}}|${{ env.TAG_NAME }}|g" README.md
        sed -i "s|{{MMDB_COUNT}}|${{ env.MMDB_COUNT }}|g" README.md
        sed -i "s|{{MMDB_NAMES}}|${{ env.MMDB_NAMES }}|g" README.md
        sed -i "s|{{REPO}}|${{ github.repository }}|g" README.md
        sed -i "s|{{KEEP_RELEASES}}|${{ env.KEEP_RELEASES }}|g" README.md
        
        # 处理 FILE_LINKS - 先删除占位行
        sed -i '/{{FILE_LINKS}}/d' README.md
        
        # 找到 "### 直接链接" 行，在其后插入链接
        LINK_LINE="### 直接链接"
        if grep -q "$LINK_LINE" README.md; then
          for file in ${{ env.MMDB_NAMES }}; do
            sed -i "/$LINK_LINE/a - [\`$file\`](https://github.com/${{ github.repository }}/releases/download/latest/$file)" README.md
          done
        fi
        
        echo "📄 README.md 生成完成"
        
        # 检查README.md是否有变化
        if ! git diff --quiet README.md; then
          git add README.md
          git commit -m "docs: 更新数据库信息 - ${{ env.TAG_NAME }}"
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
          echo "✅ README.md 已更新并提交"
        else
          echo "ℹ️ README.md 无变更，跳过提交"
        fi

    - name: 创建日期版本 Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        body: |
          ## 🗓️ 数据库更新 - ${{ env.TAG_NAME }}
          
          ### 📊 包含文件
          - 共计 **${{ env.MMDB_COUNT }}** 个数据库文件
          - 文件列表：${{ env.MMDB_NAMES }}
          
          ### 📅 更新说明
          - 自动同步于 ${{ env.TAG_NAME }}
          - 数据来源：MaxMind GeoLite2
          
          ### 🔐 文件校验
          $(for file in upload/*.mmdb; do
            echo "- \`$(basename $file)\`: \`$(sha256sum $file | cut -d' ' -f1)\`"
          done)
        files: upload/*.mmdb
        make_latest: false
        prerelease: false
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 创建 latest Release
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "📦 创建 latest Release..."
        
        gh release create latest \
          upload/*.mmdb \
          --repo "${{ github.repository }}" \
          --title "🚀 最新版本数据库 - ${{ env.TAG_NAME }}" \
          --notes "## 📦 当前版本：${{ env.TAG_NAME }}
  
          ### 包含文件
          - 共 **${{ env.MMDB_COUNT }}** 个数据库文件
          - ${{ env.MMDB_NAMES }}
          
          ### 💡 使用说明
          点击下方\"Assets\"下载对应的 \`.mmdb\` 文件。
          
          ### 📅 更新时间
          ${{ env.TAG_NAME }}
          
          ### 🔗 历史版本
          查看 [Releases](https://github.com/${{ github.repository }}/releases) 页面获取所有历史版本。
          
          ### 🔐 文件校验
          $(for file in upload/*.mmdb; do
            echo "- \`$(basename $file)\`: \`$(sha256sum $file | cut -d' ' -f1)\`"
          done)" \
          --latest \
          --draft=false \
          --prerelease=false

    - name: 清理旧版本（保留最近${{ env.KEEP_RELEASES }}个）
      if: success()
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: ${{ env.KEEP_RELEASES }}
        delete_tags: true
        delete_older_only: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
