name: Publish GeoLite.mmdb

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 0 1 */7 * *  # 每7天的凌晨1点（UTC）执行

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 延长超时时间
    permissions:
      contents: write  # 需写权限操作标签、Release和推送代码
    steps:
    - name: 检查依赖工具
      run: |
        REQUIRED_TOOLS=("wget" "tar" "git")
        for TOOL in "${REQUIRED_TOOLS[@]}"; do
            if ! command -v $TOOL &> /dev/null; then
                echo "错误: 未安装 $TOOL"
                exit 1
            fi
        done

    - name: 克隆仓库主分支（用于更新README.md）
      uses: actions/checkout@v4
      with:
        ref: main  # 替换为你的仓库主分支（如master）
        fetch-depth: 1

    - name: 下载并解压 GeoLite.mmdb
      run: |
        DATABASES=(
          "GeoLite2-ASN"
          "GeoLite2-Country"
        )
        mkdir -p upload

        for DB in "${DATABASES[@]}"; do
            echo "===== 处理 $DB 数据库 ====="
            # 下载 tar.gz 文件
            echo "正在下载 $DB 数据库..."
            wget --content-disposition --user="715750" --password="${{ secrets.LICENSE_KEY }}" \
              "https://download.maxmind.com/geoip/databases/$DB/download?suffix=tar.gz" \
              -O "${DB}.tar.gz"

            # 检查下载是否成功
            if [ ! -f "${DB}.tar.gz" ]; then
                echo "错误: $DB 数据库下载失败"
                exit 1
            fi

            # 解压文件
            echo "正在解压 ${DB}.tar.gz..."
            tar -zxvf "${DB}.tar.gz"
            UNPACK_DIR=$(ls -d ${DB}_* | head -n1)

            # 检查解压目录是否存在
            if [ -z "$UNPACK_DIR" ]; then
                echo "错误: $DB 数据库解压失败"
                exit 1
            fi

            # 精准拷贝 mmdb 文件
            cp -v "$UNPACK_DIR"/GeoLite2-*.mmdb upload/
            echo "===== $DB 数据库处理完成 =====\n"
        done

        # 检查是否成功获取 mmdb 文件
        MMDB_COUNT=$(ls -1 upload/*.mmdb 2>/dev/null | wc -l)
        if [ $MMDB_COUNT -eq 0 ]; then
            echo "错误: 未找到任何 mmdb 文件"
            exit 1
        fi
        # 获取mmdb文件列表（用于README.md）
        MMDB_FILES=$(ls -1 upload/*.mmdb | xargs -n1 basename | tr '\n' ', ')
        echo "成功获取 $MMDB_COUNT 个 mmdb 文件：$MMDB_FILES"
        # 将信息存入环境变量
        echo "MMDB_COUNT=$MMDB_COUNT" >> $GITHUB_ENV
        echo "MMDB_FILES=$MMDB_FILES" >> $GITHUB_ENV
        echo "TAG_NAME=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

      # 通过SCP将虚拟机的项目代码上传到服务器的目标目录
    - name: Upload project via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        # 上传GitHub虚拟机的项目根目录所有文件到服务器目标目录
        source: "upload/*.mmdb"
        target: "/opt/1panel/apps/openresty/openresty/www/sites/sh.yxliu.cc/index/OwnUseShell"
        # 覆盖服务器目标目录的同名文件（默认开启）
        overwrite: true

    - name: Upload project via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH1_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        # 上传GitHub虚拟机的项目根目录所有文件到服务器目标目录
        source: "upload/*.mmdb"
        target: "/opt/1panel/apps/openresty/openresty/www/sites/sh.yxliuchn.uk/index/OwnUseShell"
        # 覆盖服务器目标目录的同名文件（默认开启）
        overwrite: true      
    - name: 自动更新 README.md
      run: |
        # 修复README.md的缩进问题（移除多余空格，保证Markdown渲染正常）
        cat > README.md << EOF
        # GeoLite.mmdb 数据库仓库
        本仓库自动同步 MaxMind 官方的 GeoLite2 数据库，包含 ASN 和国家地理信息。
        
        ## 📅 最新更新时间
        ${{ env.TAG_NAME }}
        
        ## 📁 包含的数据库文件
        共 ${MMDB_COUNT} 个文件：${MMDB_FILES}
        
        ## 🚀 下载方式
        1. **Release 页面**：[最新版本](https://github.com/${{ github.repository }}/releases/tag/latest)
        2. **直接下载**：
           - [GeoLite2-ASN.mmdb](https://github.com/${{ github.repository }}/releases/download/latest/GeoLite2-ASN.mmdb)
           - [GeoLite2-Country.mmdb](https://github.com/${{ github.repository }}/releases/download/latest/GeoLite2-Country.mmdb)
        
        ## ⚙️ 自动更新
        仓库每 7 天自动从 MaxMind 官网同步最新数据库，并更新 Release 和 \`latest\` 标签。
        
        ## 📄 许可证
        本仓库的数据库文件遵循 MaxMind 官方的 [GeoLite2 许可证](https://www.maxmind.com/en/geoip2-geolite2-license)。
        EOF
        # 检查README.md是否修改成功
        cat README.md

    - name: 推送更新后的 README.md 到主分支
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        git add README.md
        # 避免空提交
        if ! git diff --quiet HEAD README.md; then
            git commit -m "docs: 更新README.md - ${{ env.TAG_NAME }}"
            git push origin main
        else
            echo "README.md 无变更，跳过推送"
        fi

    - name: 为日期标签创建 Release（不标记为最新）
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        body: "GeoLite.mmdb 数据库更新 - ${{ env.TAG_NAME }}\n共包含 ${{ env.MMDB_COUNT }} 个文件：${{ env.MMDB_FILES }}"
        files: upload/*.mmdb  # 修复：将中文「文件」改为英文files
        make_latest: false    # 该Release不标记为最新

    - name: 操作 latest 标签（覆盖为最新版本）
      run: |
        # 配置Git用户信息
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        
        # 克隆仓库（包含所有标签）
        git clone --depth=1 --tags "https://${{ github.actor }}:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}" repo
        cd repo
        
        # 等待标签同步（解决GitHub延迟问题）
        sleep 5
        git pull --tags
        
        # 验证最新版本标签是否存在
        if ! git tag -l | grep -q "${{ env.TAG_NAME }}"; then
            echo "错误: 版本标签 ${{ env.TAG_NAME }} 不存在"
            git tag -l  # 打印所有标签
            exit 1
        fi
        
        # 删除旧的latest标签
        git tag -d latest 2>/dev/null || echo "本地无 latest 标签，跳过删除"
        git push origin :refs/tags/latest 2>/dev/null || echo "远程无 latest 标签，跳过删除"
        
        # 基于最新版本标签创建latest标签（轻量标签）
        git tag -f latest ${{ env.TAG_NAME }}
        # 推送latest标签（强制推送确保覆盖）
        git push origin latest --force
        
        # 验证latest标签指向
        echo "latest 标签指向的提交："
        git rev-parse latest
        echo "最新版本标签指向的提交："
        git rev-parse ${{ env.TAG_NAME }}
        echo "成功将 latest 标签关联到 ${{ env.TAG_NAME }}"

    - name: 为 latest 标签创建 Release 并标记为最新
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: latest
        body: "GeoLite.mmdb 数据库最新版本（${{ env.TAG_NAME }}）\n共包含 ${{ env.MMDB_COUNT }} 个文件：${{ env.MMDB_FILES }}"
        files: upload/*.mmdb  # 修复：将中文「文件」改为英文files
        make_latest: true     # 该Release标记为仓库的Latest Release

    - name: 清理旧 Releases（保留最新5个）
      uses: dev-drprasad/delete-older-releases@v0.2.0
      with:
        keep_latest: 5
        delete_tags: true     # 同时删除旧的标签（不含latest标签，因是最后创建的）
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
